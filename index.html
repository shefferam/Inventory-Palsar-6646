<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0b">
  <meta name="description" content="פלס״ר 6646 – מערכת ניהול ציוד ומלאי">
  <title>פלס״ר 6646 · מערכת ניהול ציוד ומלאי</title>
  <link rel="icon" type="image/jpeg" href="assets/Palsar.jpeg" id="favicon">
  <link rel="apple-touch-icon" href="assets/Palsar.jpeg" id="touch-icon">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Splash -->
  <section id="splash" class="splash" aria-label="מסך פתיחה">
    <div class="splash__bg" aria-hidden="true"></div>
    <div class="splash__content">
      <div class="emblem emblem--xl splash__emblem">
        <img src="assets/Palsar.jpeg" alt="סמל יחידת פלס״ר 6646" width="300" height="300" decoding="async">
      </div>
      <p class="splash__motto">"הגב אליך, הלב איתך"</p>
      <h1 class="splash__title">פלס"ר 6646</h1>
      <p class="splash__subtitle">מערכת ניהול ציוד ומלאי</p>
    </div>
    <button type="button" class="splash__skip" id="splash-skip">דלג</button>
  </section>

  <!-- Login -->
  <main id="login" class="login screen" hidden>
    <div class="login__bg" aria-hidden="true"></div>
    <div class="login__card">
      <div class="emblem emblem--lg login__emblem">
        <img src="assets/Palsar.jpeg" alt="סמל יחידת פלס״ר 6646" width="300" height="300" decoding="async">
      </div>
      <h1 class="login__title">פלס"ר 6646</h1>
      <p class="login__subtitle">מערכת ניהול ציוד ומלאי</p>
      <p class="login__motto">"הגב אליך, הלב איתך"</p>

      <button type="button" class="btn btn--google" id="google-login">
        <svg class="btn__icon" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
        </svg>
        <span>התחברות באמצעות Google</span>
      </button>
      <div class="gis-button" id="gis-button" hidden></div>
      <p class="login__error" id="login-error" role="alert" hidden></p>
      <button type="button" class="btn btn--link" id="demo-login" hidden>כניסה במצב הדגמה</button>
      <p class="login__note" id="login-note" hidden>התחברות Google טרם הוגדרה (GOOGLE_CLIENT_ID בקובץ js/config.js).</p>
    </div>
  </main>

  <!-- App shell -->
  <div id="app" class="app screen" hidden>
    <header class="topbar">
      <a class="brand" href="#/dashboard" aria-label="פלס״ר 6646 – דשבורד">
        <span class="emblem emblem--xs"><img src="assets/Palsar.jpeg" alt="" width="300" height="300"></span>
        <span class="brand__text">
          <strong>פלס"ר 6646</strong>
          <small>ניהול ציוד ומלאי</small>
        </span>
      </a>
      <nav class="nav" aria-label="ניווט ראשי">
        <a href="#/dashboard" data-route="dashboard">דשבורד</a>
        <a href="#/soldiers" data-route="soldiers">חיילים</a>
        <a href="#/about" data-route="about">אודות</a>
      </nav>
      <div class="user">
        <span class="user__name" id="user-name"></span>
        <button type="button" class="btn btn--ghost btn--sm" id="logout">יציאה</button>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <dialog id="crate-dialog" class="crate-dialog" aria-labelledby="crate-dialog-title"></dialog>
  <dialog id="soldier-dialog" class="crate-dialog soldier-dialog" aria-labelledby="soldier-dialog-title"></dialog>
  <dialog id="form-dialog" class="form-dialog" aria-label="טופס"></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
